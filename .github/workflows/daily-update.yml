name: Daily education data check

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-education-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover new programs and check current status
        run: node scripts/update-programs.mjs
      - name: Save the latest public data
        run: |
          git config user.name "baeum-ieum-bot"
          git config user.email "baeum-ieum-bot@users.noreply.github.com"
          git add data/programs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Daily education data check [skip ci]"
          git push
